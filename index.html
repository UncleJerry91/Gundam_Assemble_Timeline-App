h1{color:#fff;text-shadow:0 2px 8px #000}
@media (orientation:landscape) and (min-width:700px){
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;row-gap:12px;align-items:start}
main>section{margin-top:0}
.top{grid-column:1/-1}
.s-vp{grid-column:1/-1;grid-row:2}
.s-track{grid-column:1/-1;grid-row:3}
.s-next{grid-column:1;grid-row:4;align-self:stretch}.s-add{grid-column:2;grid-row:4;align-self:stretch}.s-log{grid-column:1/-1;grid-row:5}
}
#rot{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#0b0e14;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column;gap:12px}
@media (orientation:portrait) and (min-width:700px){#rot{display:flex}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
button.go{background:var(--hi);color:var(--hit);border-color:var(--hi);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input[type=text]{flex:1;min-width:130px}
.muted{color:var(--mt);font-size:13px}
.next{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.next .num{font-size:30px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dot.A{background:var(--a)}.dot.B{background:var(--b)}
.hd,.tr{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px}
.hd{margin-bottom:6px;font-weight:700;text-align:center}
.hd .A{color:var(--a)}.hd .B{color:var(--b)}
.tr{margin-bottom:5px}
.sp{border-radius:6px;font-size:20px;color:var(--mt);padding:0;min-height:44px}
.tr.cur .sp{background:var(--hi);color:var(--hit);border-color:var(--hi)}
.lane{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--ln);border-radius:6px;padding:3px;min-height:44px}
.tok{width:100%;text-align:left;color:#fff;border:0;padding:9px 10px;font-weight:600;font-size:14px;line-height:1.15}
.tok small{font-weight:400;opacity:.85}
.tok.A{background:var(--a)}.tok.B{background:var(--b)}
.tok.im{background-size:cover;background-position:center;text-shadow:0 1px 3px #000;border-left:6px solid}
.tok.im.A{border-left-color:var(--a)}.tok.im.B{border-left-color:var(--b)}
.pic{height:84px;border-radius:8px;margin-bottom:10px;background-size:cover;background-position:center}
.tok.act{box-shadow:0 0 0 3px var(--hi)}
.tok.sel{outline:3px solid var(--tx);outline-offset:1px}
button,input,select{touch-action:manipulation}
.tok{min-height:48px}
.bar{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.bar.open{display:flex}
.bar{cursor:pointer}.card{cursor:default}
.nogap .row>*{margin:0 8px 8px 0}
.nogap .vcell .row>*{margin:0 3px}
.nogap .lane>*{margin-bottom:4px}.nogap .lane>*:last-child{margin-bottom:0}
.nogap .next>*{margin-right:10px}.nogap .lb>*{margin-left:6px}
.nogap .vcell>*{margin-bottom:6px}.nogap #rot>*{margin-bottom:12px}.nogap .top>*{margin-right:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;width:100%;max-width:380px;text-align:center;max-height:92vh;overflow-y:auto}
.rm{color:#fff;background:#b3261e;border-color:#b3261e;min-height:48px;font-weight:600}
.lb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mt)}
#track{overflow-x:auto}
.vcell{background:rgba(128,128,128,.2);border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:13px}
.vcell.A{background:var(--aa)}
.vcell.B{background:var(--ba)}
.vb{min-width:38px;min-height:42px;padding:0;font-size:17px}
.tl{display:grid;grid-template-columns:50px repeat(10,minmax(84px,1fr));grid-gap:4px;gap:4px;align-items:stretch}
.rl{display:flex;align-items:center;font-weight:700;font-size:13px}
.rl.A{color:var(--a)}.rl.B{color:var(--b)}
.sp.cur{background:var(--hi);color:var(--hit);border-color:var(--hi)}
.lane{min-height:108px}
.tok{height:98px;min-height:98px;padding:5px 7px;font-size:13px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;flex:none}
.big{font-size:48px;min-width:120px;min-height:88px;border-radius:12px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
.bar .row button{min-width:48px}
.bar input{width:64px}
#log{max-height:140px;overflow:auto;margin:0;padding-left:18px}
.hpb{min-width:64px;min-height:56px;font-size:24px;border-radius:10px}
.next{display:block}
.nxt{padding:10px 14px;border-radius:8px;border-left:8px solid}
.nxt.A{background:var(--aa);border-left-color:var(--a)}.nxt.B{background:var(--ba);border-left-color:var(--b)}
.nl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mt)}
.nn{font-size:34px;line-height:1.05}.nm2{font-weight:600}
.s-next{display:flex;flex-direction:column}
.s-next .next{flex:1;display:flex}
.nxt{flex:1;display:flex;align-items:center;justify-content:space-between}
.nxt-t{flex:1;min-width:0}
.nxt-p{width:42%;max-width:190px;align-self:stretch;min-height:96px;border-radius:8px;background-size:cover;background-position:center;margin-left:12px}
.vt{font-weight:700;text-align:center;margin-bottom:8px;font-size:13px;letter-spacing:.06em}
.vrow{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px}
.vc{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px}
.vc.A{background:var(--aa)}.vc.B{background:var(--ba)}
.vn{font-weight:700;font-size:15px}.vc .num{font-size:40px}
.vc .vb{min-width:52px;min-height:48px;font-size:20px;margin-left:6px}
.vbs{display:flex}
.sw{display:none}
@media (max-width:700px){
main{padding:10px}
h1{font-size:22px}.next .num{font-size:24px}
input,select{font-size:16px}
#pick{flex:1 1 100%}
.sw{display:block;margin:6px 0 0}
.tl{grid-template-columns:34px repeat(10,minmax(66px,1fr))}
.tok{height:84px;min-height:84px;font-size:11px;padding:4px 5px}
.lane{min-height:92px}
.rl{font-size:11px}
.sp{min-height:34px;font-size:16px}
.vcell{font-size:11px;padding:4px}
.vcell .num{font-size:26px!important}
.vb{min-width:30px;min-height:38px;font-size:15px}
.card{padding:14px}
.big{min-width:92px;min-height:72px;font-size:40px}
.hpb{min-width:56px;min-height:50px;font-size:22px}
.vrow{grid-template-columns:1fr}.vc{padding:8px 10px}.vc .num{font-size:30px}.nn{font-size:26px}
}
</style>
</head>
<body>
<main>
<div class="top"><h1>Assemble Timeline</h1>
<div class="row"><button id="undo">Undo</button><button id="reset">Clear all</button></div></div>

<section class="s-vp"><div id="vp"></div></section>

<section class="s-next">
<div class="next" id="next"></div>
<div class="row" style="margin-top:8px"><label class="muted" for="tie">Same space, acts first:</label>
<select id="tie"><option value="old">Arrived earliest</option><option value="new">Arrived latest</option></select></div>
</section>

<div class="bar" id="bar"></div>

<section class="s-track"><div id="track"></div><p class="muted sw">Swipe the timeline sideways to see all spaces.</p></section>

<section class="s-add"><h2>Add a model</h2>
<div class="row"><select id="pick" aria-label="Model"></select>
<input type="text" id="nm" placeholder="Custom model name" aria-label="Custom model name" style="display:none">
<select id="tm" aria-label="Team"><option value="A">Blue</option><option value="B">Red</option></select>
<label class="lb">Timeline Position <input type="number" id="st" min="1" max="10" value="1" style="width:70px" aria-label="Timeline Position" title="Timeline Position"></label><input type="number" id="hp" min="1" value="10" style="width:70px;display:none" aria-label="HP" title="HP">

var S={units:[],seq:0,log:[]},H=[],sel=null,tie="old",$=function(i){return document.getElementById(i)};
try{var sv=localStorage.getItem("gat");if(sv){S=JSON.parse(sv).S}}catch(e){}
function save(){try{localStorage.setItem("gat",JSON.stringify({S:S}))}catch(e){}}
function snap(){H.push(JSON.stringify(S));if(H.length>100)H.shift()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function order(){return S.units.slice().sort(function(a,b){return a.pos!==b.pos?a.pos-b.pos:(tie==="old"?a.seq-b.seq:b.seq-a.seq)})}
function get(id){return S.units.find(function(u){return u.id===id})}
function move(id,cost){var u=get(id);if(!u||!(cost>=0))return;
 snap();var f=u.pos;u.pos+=cost;u.seq=++S.seq;
 S.log.unshift(u.name+": "+f+" → "+u.pos+" (cost "+cost+")");S.log=S.log.slice(0,40);sel=null;render()}
function vpchg(t,n){S.vp=S.vp||{A:0,B:0};var v=Math.max(0,S.vp[t]+n);if(v===S.vp[t])return;snap();S.log.unshift((t==="A"?"Blue":"Red")+" VP: "+S.vp[t]+" → "+v);S.log=S.log.slice(0,40);S.vp[t]=v;render()}
function hpchg(id,n){var u=get(id);if(!u||!u.mhp)return;var h=Math.max(0,Math.min(u.mhp,u.hp+n));if(h===u.hp)return;snap();S.log.unshift(u.name+" HP: "+u.hp+" → "+h);S.log=S.log.slice(0,40);u.hp=h;render()}

$("pick").onchange=function(){var c=this.value==="custom";$("nm").style.display=c?"":"none";$("hp").style.display=c?"":"none";if(!c){var v=this.value,m=M.find(function(x){return x[0]===v});if(m){$("st").value=m[1];$("hp").value=m[2]}}};
$("st").value=M[0][1];$("hp").value=M[0][2];
$("add").onclick=function(){var pk=$("pick").value,n=pk==="custom"?$("nm").value.trim():pk;if(!n)return;
 var h=Math.max(1,parseInt($("hp").value,10)||1);snap();S.units.push({id:Date.now()+S.seq,name:n,team:$("tm").value,pos:Math.max(1,parseInt($("st").value,10)||1),seq:++S.seq,hp:h,mhp:h});
 $("nm").value="";render()};
$("tie").onchange=function(){tie=this.value;render()};
$("undo").onclick=function(){if(H.length){S=JSON.parse(H.pop());sel=null;render()}};
$("reset").onclick=function(){snap();S={units:[],seq:0,log:[]};sel=null;render()};
render();
try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}
</script>
</body>
</html>
